# ---- exams -------------------------------------------------------

[[exams]]
id = "wb-wbcs"
name = "West Bengal Civil Service (Executive) etc. Examination"
known_as = ["WBCS"]
jurisdiction = "wb"
purpose = "recruitment"
conducted_by = "wb-wbpsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['\bWBCS\b', 'civil\s*service\s*\(?\s*exe'] }
status = "active"

[[exams]]
id = "wb-wbpsc-ae"
name = "WBPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "wb"
purpose = "recruitment"
conducted_by = "wb-wbpsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
