# ---- exams -------------------------------------------------------

[[exams]]
id = "br-bpsc-cce"
name = "BPSC Integrated Combined Competitive Examination"
known_as = ["BPSC CCE", "BPSC 70th", "BPSC 71st"]
jurisdiction = "br"
purpose = "recruitment"
conducted_by = "br-bpsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['combined\s*competitive', '\bCCE\b', '\b\d{2}(st|nd|rd|th)\s*CCE'] }
status = "active"

[[exams]]
id = "br-bpsc-ae"
name = "BPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "br"
purpose = "recruitment"
conducted_by = "br-bpsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
