# ---- exams -------------------------------------------------------

[[exams]]
id = "pb-ppsc-pcs"
name = "Punjab State Civil Services Combined Competitive Examination"
known_as = ["Punjab PCS"]
jurisdiction = "pb"
purpose = "recruitment"
conducted_by = "pb-ppsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['civil\s*services\s*combined', '\bPCS\b(?![-\s]*\(?J)'] }
status = "active"

[[exams]]
id = "pb-ppsc-ae"
name = "PPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "pb"
purpose = "recruitment"
conducted_by = "pb-ppsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "pb-ppsc-lecturer"
name = "PPSC Lecturer / Assistant Professor Recruitment"
jurisdiction = "pb"
purpose = "recruitment"
conducted_by = "pb-ppsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "pb-ppsc-judicial"
name = "PPSC Civil Judge (Junior Division) / Judicial Services Examination"
jurisdiction = "pb"
purpose = "recruitment"
conducted_by = "pb-ppsc"
frequency = "irregular"
qualification = "professional"
streams = ["judiciary", "law"]
match = { any = ['civil\s*judge', 'judicial\s*service', '\bPCS[-\s]*\(?J\)?', 'judicial\s*magistrate'] }
status = "active"

[[exams]]
id = "pb-ppsc-other"
name = "PPSC Recruitment to other posts (umbrella)"
jurisdiction = "pb"
purpose = "recruitment"
conducted_by = "pb-ppsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

