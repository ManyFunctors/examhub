# Catalogue: Mizoram. Canonical form; edit freely, then
# `python -m examhub_pipeline catalogue fmt` to normalise. See docs/data-model.md.

# ---- bodies ------------------------------------------------------

[[bodies]]
id = "mz-mpsc"
name = "Mizoram Public Service Commission"
short_name = "MPSC (Mizoram)"
jurisdiction = "mz"
kind = "public_service_commission"
website = "https://mpsc.mizoram.gov.in/"
hosts = ["mpsc.mizoram.gov.in", "mpsconline.mizoram.gov.in"]
status = "active"

[[bodies]]
id = "mz-mbse"
name = "Mizoram Board of School Education"
short_name = "MBSE"
jurisdiction = "mz"
kind = "school_board"
website = "https://mbse.edu.in/"
status = "active"

[[bodies]]
id = "mz-police"
name = "Mizoram Police"
short_name = "Mizoram Police"
jurisdiction = "mz"
kind = "police_recruitment_board"
website = "https://police.mizoram.gov.in/"
status = "active"

# ---- feeds -------------------------------------------------------

[[feeds]]
id = "mz-mpsc/posts"
body = "mz-mpsc"
url = "https://mpsc.mizoram.gov.in/posts"
adapter = "html_links"
yields = "notices"
include = '\.pdf|notif|advt|advertisement|recruit|result|admit|hall\s*ticket|answer|key|schedule|calendar|notice|exam'
status = "active"

[[feeds]]
id = "mz-mpsc/direct-recruitment"
body = "mz-mpsc"
url = "https://mpsc.mizoram.gov.in/page/direct-recruitment"
adapter = "html_links"
yields = "notices"
include = '\.pdf|notif|advt|advertisement|recruit|result|admit|hall\s*ticket|answer|key|schedule|calendar|notice|exam'
status = "active"

[[feeds]]
id = "mz-mbse/home"
body = "mz-mbse"
url = "https://mbse.edu.in/"
adapter = "html_links"
yields = "notices"
include = '\.pdf|exam|result|time\s*table|routine|schedule|notice|admit|hall|circular'
status = "active"

[[feeds]]
id = "mz-police/home"
body = "mz-police"
url = "https://police.mizoram.gov.in/"
adapter = "html_links"
yields = "notices"
include = '\.pdf|notif|advt|advertisement|recruit|result|admit|hall\s*ticket|answer|key|schedule|calendar|notice|exam'
status = "active"

# ---- exams -------------------------------------------------------

[[exams]]
id = "mz-mcs"
name = "Mizoram Civil Services Combined Competitive Examination"
jurisdiction = "mz"
purpose = "recruitment"
conducted_by = "mz-mpsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['civil\s*services', 'combined\s*competitive', '\bMCS\b'] }
status = "active"

[[exams]]
id = "mz-mpsc-ae"
name = "MPSC (Mizoram) Assistant Engineer / Engineering Services Examination"
jurisdiction = "mz"
purpose = "recruitment"
conducted_by = "mz-mpsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "mz-mpsc-lecturer"
name = "MPSC (Mizoram) Lecturer / Assistant Professor Recruitment"
jurisdiction = "mz"
purpose = "recruitment"
conducted_by = "mz-mpsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "mz-mpsc-other"
name = "MPSC (Mizoram) Recruitment to other posts (umbrella)"
jurisdiction = "mz"
purpose = "recruitment"
conducted_by = "mz-mpsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

[[exams]]
id = "mz-mbse-class-10"
name = "MBSE HSLC Examination"
jurisdiction = "mz"
purpose = "school_board"
conducted_by = "mz-mbse"
frequency = "annual"
qualification = "class_8"
streams = ["school"]
match = { any = ['\bHSLC\b', 'class\s*(X|10)\b'], none = ['higher\s*secondary', '\bHSC\b', 'class\s*(XII|12)\b'] }
status = "active"

[[exams]]
id = "mz-mbse-class-12"
name = "MBSE HSSLC Examination"
jurisdiction = "mz"
purpose = "school_board"
conducted_by = "mz-mbse"
frequency = "annual"
qualification = "class_10"
streams = ["school"]
match = { any = ['\bHSSLC\b', 'class\s*(XII|12)\b'] }
status = "active"

[[exams]]
id = "mz-mtet"
name = "Mizoram Teacher Eligibility Test"
short_name = "MTET"
jurisdiction = "mz"
purpose = "eligibility"
conducted_by = "mz-mbse"
frequency = "irregular"
qualification = "class_12"
streams = ["teaching"]
match = { any = ['\bTET\b'] }
status = "active"

[[exams]]
id = "mz-police-constable"
name = "Mizoram Police Police Constable Recruitment"
jurisdiction = "mz"
purpose = "recruitment"
conducted_by = "mz-police"
frequency = "irregular"
qualification = "class_12"
streams = ["police"]
match = { any = ["constable", "sipahi|sepoy", '\bPC\b'] }
status = "active"

[[exams]]
id = "mz-police-si"
name = "Mizoram Police Sub-Inspector Recruitment"
jurisdiction = "mz"
purpose = "recruitment"
conducted_by = "mz-police"
frequency = "irregular"
qualification = "graduate"
streams = ["police"]
match = { any = ['sub[-\s]*inspector', '\bS\.?I\.?\b', "daroga"] }
status = "active"
