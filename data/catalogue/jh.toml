# ---- exams -------------------------------------------------------

[[exams]]
id = "jh-jpsc-cse"
name = "JPSC Combined Civil Services Examination"
known_as = ["JPSC CSE"]
jurisdiction = "jh"
purpose = "recruitment"
conducted_by = "jh-jpsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['combined\s*civil\s*services', 'civil\s*services'] }
status = "active"

[[exams]]
id = "jh-jpsc-ae"
name = "JPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "jh"
purpose = "recruitment"
conducted_by = "jh-jpsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "jh-jpsc-lecturer"
name = "JPSC Lecturer / Assistant Professor Recruitment"
jurisdiction = "jh"
purpose = "recruitment"
conducted_by = "jh-jpsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "jh-jpsc-judicial"
name = "JPSC Civil Judge (Junior Division) / Judicial Services Examination"
jurisdiction = "jh"
purpose = "recruitment"
conducted_by = "jh-jpsc"
frequency = "irregular"
qualification = "professional"
streams = ["judiciary", "law"]
match = { any = ['civil\s*judge', 'judicial\s*service', '\bPCS[-\s]*\(?J\)?', 'judicial\s*magistrate'] }
status = "active"

[[exams]]
id = "jh-jpsc-other"
name = "JPSC Recruitment to other posts (umbrella)"
jurisdiction = "jh"
purpose = "recruitment"
conducted_by = "jh-jpsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

