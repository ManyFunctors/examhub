# ---- exams -------------------------------------------------------

[[exams]]
id = "ap-appsc-group-1"
name = "APPSC Group-I Services"
known_as = ["APPSC Group 1"]
jurisdiction = "ap"
purpose = "recruitment"
conducted_by = "ap-appsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['group[-\s]*(I|1)\b(?!I)'] }
status = "active"

[[exams]]
id = "ap-appsc-ae"
name = "APPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "ap"
purpose = "recruitment"
conducted_by = "ap-appsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "ap-appsc-lecturer"
name = "APPSC Lecturer / Assistant Professor Recruitment"
jurisdiction = "ap"
purpose = "recruitment"
conducted_by = "ap-appsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "ap-appsc-other"
name = "APPSC Recruitment to other posts (umbrella)"
jurisdiction = "ap"
purpose = "recruitment"
conducted_by = "ap-appsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

