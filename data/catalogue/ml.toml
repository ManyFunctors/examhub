# ---- exams -------------------------------------------------------

[[exams]]
id = "ml-mcs"
name = "Meghalaya Civil Services Examination"
known_as = ["MCS"]
jurisdiction = "ml"
purpose = "recruitment"
conducted_by = "ml-mpsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['civil\s*services?', '\bMCS\b'] }
status = "active"

[[exams]]
id = "ml-mpsc-ae"
name = "MPSC (Meghalaya) Assistant Engineer / Engineering Services Examination"
jurisdiction = "ml"
purpose = "recruitment"
conducted_by = "ml-mpsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "ml-mpsc-lecturer"
name = "MPSC (Meghalaya) Lecturer / Assistant Professor Recruitment"
jurisdiction = "ml"
purpose = "recruitment"
conducted_by = "ml-mpsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "ml-mpsc-other"
name = "MPSC (Meghalaya) Recruitment to other posts (umbrella)"
jurisdiction = "ml"
purpose = "recruitment"
conducted_by = "ml-mpsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

[[exams]]
id = "ml-mbose-class-10"
name = "MBOSE SSLC Examination"
jurisdiction = "ml"
purpose = "school_board"
conducted_by = "ml-mbose"
frequency = "annual"
qualification = "class_8"
streams = ["school"]
match = { any = ['\bSSLC\b', 'class\s*(X|10)\b'], none = ['higher\s*secondary', '\bHSC\b', 'class\s*(XII|12)\b'] }
status = "active"

[[exams]]
id = "ml-mbose-class-12"
name = "MBOSE HSSLC Examination"
jurisdiction = "ml"
purpose = "school_board"
conducted_by = "ml-mbose"
frequency = "annual"
qualification = "class_10"
streams = ["school"]
match = { any = ['\bHSSLC\b', 'class\s*(XII|12)\b'] }
status = "active"

[[exams]]
id = "ml-mtet"
name = "Meghalaya Teacher Eligibility Test"
short_name = "MTET"
jurisdiction = "ml"
purpose = "eligibility"
conducted_by = "ml-mbose"
frequency = "irregular"
qualification = "class_12"
streams = ["teaching"]
match = { any = ['\bMTET\b', '\bTET\b'] }
status = "active"

[[exams]]
id = "ml-police-constable"
name = "Meghalaya Police Police Constable Recruitment"
jurisdiction = "ml"
purpose = "recruitment"
conducted_by = "ml-police"
frequency = "irregular"
qualification = "class_12"
streams = ["police"]
match = { any = ["constable", "sipahi|sepoy", '\bPC\b'] }
status = "active"

[[exams]]
id = "ml-police-si"
name = "Meghalaya Police Sub-Inspector Recruitment"
jurisdiction = "ml"
purpose = "recruitment"
conducted_by = "ml-police"
frequency = "irregular"
qualification = "graduate"
streams = ["police"]
match = { any = ['sub[-\s]*inspector', '\bS\.?I\.?\b', "daroga"] }
status = "active"

[[exams]]
id = "ml-health-recruitment"
name = "Meghalaya Health Recruitment (Staff Nurse, ANM, Medical Officer)"
jurisdiction = "ml"
purpose = "recruitment"
conducted_by = "ml-health"
frequency = "irregular"
qualification = "diploma"
streams = ["nursing", "medical"]
match = { any = ['staff\s*nurse', '\bANM\b', 'medical\s*officer', "recruitment"] }
status = "active"

[[exams]]
id = "ml-hc-staff"
name = "Meghalaya HC Staff Recruitment (Clerk, Stenographer, Typist, Peon, and district courts)"
jurisdiction = "ml"
purpose = "recruitment"
conducted_by = "ml-hc"
frequency = "irregular"
qualification = "class_10"
streams = ["judiciary", "clerical"]
match = { any = ["clerk", "steno", "typist", "peon", "assistant", 'process\s*server', "driver", 'district\s*court', "group\\s*['‘’]?\\s*[CD]\\b", "recruitment"] }
status = "active"
