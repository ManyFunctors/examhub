# ---- bodies ------------------------------------------------------

[[bodies]]
id = "dh-admin"
name = "Administration of Dadra and Nagar Haveli and Daman and Diu"
short_name = "DNH&DD Administration"
jurisdiction = "dh"
kind = "ministry_department"
