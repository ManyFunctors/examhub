# ---- exams -------------------------------------------------------

[[exams]]
id = "ga-gpsc-gcs"
name = "Goa Civil Service Examination"
jurisdiction = "ga"
purpose = "recruitment"
conducted_by = "ga-gpsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['civil\s*service', '\bGCS\b'] }
status = "active"

[[exams]]
id = "ga-gpsc-ae"
name = "Goa PSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "ga"
purpose = "recruitment"
conducted_by = "ga-gpsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "ga-gpsc-lecturer"
name = "Goa PSC Lecturer / Assistant Professor Recruitment"
jurisdiction = "ga"
purpose = "recruitment"
conducted_by = "ga-gpsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "ga-gpsc-other"
name = "Goa PSC Recruitment to other posts (umbrella)"
jurisdiction = "ga"
purpose = "recruitment"
conducted_by = "ga-gpsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

[[exams]]
id = "ga-gssc-recruitment"
name = "Goa Staff Selection Commission Group C Recruitment"
jurisdiction = "ga"
purpose = "recruitment"
conducted_by = "ga-gssc"
frequency = "multiple"
qualification = "class_12"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|group\\s*['‘’]?\\s*C\\b"] }
status = "active"

[[exams]]
id = "ga-gbshse-class-10"
name = "GBSHSE SSC Examination"
jurisdiction = "ga"
purpose = "school_board"
conducted_by = "ga-gbshse"
frequency = "annual"
qualification = "class_8"
streams = ["school"]
match = { any = ['\bSSC\b', 'class\s*(X|10)\b'], none = ['higher\s*secondary', '\bHSC\b', 'class\s*(XII|12)\b'] }
status = "active"

[[exams]]
id = "ga-gbshse-class-12"
name = "GBSHSE HSSC Examination"
jurisdiction = "ga"
purpose = "school_board"
conducted_by = "ga-gbshse"
frequency = "annual"
qualification = "class_10"
streams = ["school"]
match = { any = ['\bHSSC\b', 'class\s*(XII|12)\b'] }
status = "active"

[[exams]]
id = "ga-gtet"
name = "Goa Teacher Eligibility Test"
short_name = "GTET"
jurisdiction = "ga"
purpose = "eligibility"
conducted_by = "ga-gbshse"
frequency = "irregular"
qualification = "class_12"
streams = ["teaching"]
match = { any = ['\bGTET\b', '\bTET\b'] }
status = "active"

[[exams]]
id = "ga-gcet"
name = "Goa Common Entrance Test"
short_name = "GCET"
jurisdiction = "ga"
purpose = "admission"
conducted_by = "ga-dte"
frequency = "annual"
qualification = "class_12"
streams = ["engineering", "pharmacy"]
match = { any = ['\bGCET\b', 'common\s*entrance'] }
status = "active"
