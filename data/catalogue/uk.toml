jurisdiction = "uk"
purpose = "recruitment"
conducted_by = "uk-uksssc"
frequency = "irregular"
qualification = "class_12"
streams = ["police"]
match = { any = ["constable", 'sub[-\s]*inspector', "police"] }
status = "active"

[[exams]]
id = "uk-uksssc-forest-guard"
