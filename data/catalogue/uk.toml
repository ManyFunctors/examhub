[[exams]]
id = "uk-uksssc-group-c"
name = "UKSSSC Group C Combined Examination (umbrella)"
jurisdiction = "uk"
purpose = "recruitment"
conducted_by = "uk-uksssc"
frequency = "multiple"
qualification = "class_12"
streams = ["general"]
match = { any = ["group\\s*['‘’]?\\s*C\\b", "advt|advertisement|recruitment|vacanc"] }
status = "active"

[[exams]]
id = "uk-ubse-class-10"
name = "UBSE High School Examination"
jurisdiction = "uk"
purpose = "school_board"
conducted_by = "uk-ubse"
frequency = "annual"
qualification = "class_8"
streams = ["school"]
match = { any = ['class\s*(X|10)\b', '\b(SSC|SSLC|HSLC|matric|madhyamik|secondary)\b(?!.*higher)'], none = ['higher\s*secondary', '\bHSC\b', 'class\s*(XII|12)\b'] }
status = "active"

[[exams]]
id = "uk-ubse-class-12"
name = "UBSE Intermediate Examination"
jurisdiction = "uk"
purpose = "school_board"
conducted_by = "uk-ubse"
frequency = "annual"
qualification = "class_10"
streams = ["school"]
match = { any = ['class\s*(XII|12)\b', '\b(HSC|HSSC|intermediate|inter|higher\s*secondary|uchha|plus\s*two|\+2|PUC)\b'] }
status = "active"

[[exams]]
id = "uk-utet"
