# ---- exams -------------------------------------------------------

[[exams]]
id = "uk-ukpsc-upper-pcs"
name = "Uttarakhand Combined State Civil / Upper Subordinate Services Examination"
known_as = ["UKPSC PCS", "Upper PCS"]
jurisdiction = "uk"
purpose = "recruitment"
conducted_by = "uk-ukpsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['upper\s*(PCS|subordinate)', 'combined\s*state\s*civil'] }
status = "active"

[[exams]]
id = "uk-ukpsc-ae"
name = "UKPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "uk"
purpose = "recruitment"
conducted_by = "uk-ukpsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "uk-ukpsc-lecturer"
name = "UKPSC Lecturer / Assistant Professor Recruitment"
jurisdiction = "uk"
purpose = "recruitment"
conducted_by = "uk-ukpsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "uk-ukpsc-judicial"
name = "UKPSC Civil Judge (Junior Division) / Judicial Services Examination"
jurisdiction = "uk"
purpose = "recruitment"
conducted_by = "uk-ukpsc"
frequency = "irregular"
qualification = "professional"
streams = ["judiciary", "law"]
match = { any = ['civil\s*judge', 'judicial\s*service', '\bPCS[-\s]*\(?J\)?', 'judicial\s*magistrate'] }
status = "active"

[[exams]]
id = "uk-ukpsc-other"
name = "UKPSC Recruitment to other posts (umbrella)"
jurisdiction = "uk"
purpose = "recruitment"
conducted_by = "uk-ukpsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

[[exams]]
id = "uk-ukpsc-lower-pcs"
name = "Uttarakhand Lower Subordinate Services Examination"
jurisdiction = "uk"
purpose = "recruitment"
conducted_by = "uk-ukpsc"
frequency = "irregular"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['lower\s*(PCS|subordinate)'] }
status = "active"

[[exams]]
