status = "active"

[[exams]]
id = "uk-uksssc-vdo-patwari"
name = "UKSSSC VDO / VPDO / Patwari / Lekhpal"
jurisdiction = "uk"
purpose = "recruitment"
conducted_by = "uk-uksssc"
frequency = "irregular"
qualification = "class_12"
streams = ["clerical"]
match = { any = ['\bVDO\b|\bVPDO\b', "patwari", "lekhpal", 'gram\s*vikas'] }
