# ---- exams -------------------------------------------------------

[[exams]]
id = "rj-rpsc-ras"
name = "Rajasthan State and Subordinate Services Combined Competitive Examination (RAS/RTS)"
known_as = ["RAS", "RPSC RAS"]
jurisdiction = "rj"
purpose = "recruitment"
conducted_by = "rj-rpsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['\bRAS\b', 'state\s*and\s*subordinate\s*services'] }
status = "active"

[[exams]]
id = "rj-rpsc-ae"
name = "RPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "rj"
purpose = "recruitment"
conducted_by = "rj-rpsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "rj-rpsc-lecturer"
name = "RPSC Lecturer / Assistant Professor Recruitment"
jurisdiction = "rj"
purpose = "recruitment"
conducted_by = "rj-rpsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "rj-rpsc-other"
name = "RPSC Recruitment to other posts (umbrella)"
jurisdiction = "rj"
purpose = "recruitment"
conducted_by = "rj-rpsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

