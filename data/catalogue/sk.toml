# ---- feeds -------------------------------------------------------

[[feeds]]
id = "sk-spsc/home"
body = "sk-spsc"
url = "https://spscrs.sikkim.gov.in/"
adapter = "html_links"
yields = "notices"
include = '\.pdf|notif|advt|advertisement|recruit|result|admit|hall\s*ticket|answer|key|schedule|calendar|notice|exam'
status = "active"

[[feeds]]
id = "sk-police/home"
body = "sk-police"
url = "https://sikkimpolice.nic.in/"
adapter = "html_links"
yields = "notices"
include = '\.pdf|notif|advt|advertisement|recruit|result|admit|hall\s*ticket|answer|key|schedule|calendar|notice|exam'
status = "active"

[[feeds]]
id = "sk-hrdd/home"
body = "sk-hrdd"
url = "https://sikkimhrdd.org/"
adapter = "html_links"
yields = "notices"
include = '\.pdf|notif|advt|advertisement|recruit|result|admit|hall\s*ticket|answer|key|schedule|calendar|notice|exam'
status = "active"

# ---- exams -------------------------------------------------------

[[exams]]
id = "sk-spsc-cce"
name = "Sikkim State Civil Services Combined Competitive Examination"
jurisdiction = "sk"
purpose = "recruitment"
conducted_by = "sk-spsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['civil\s*services', 'combined\s*competitive'] }
status = "active"

[[exams]]
id = "sk-spsc-ae"
name = "SPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "sk"
purpose = "recruitment"
conducted_by = "sk-spsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "sk-spsc-lecturer"
name = "SPSC Lecturer / Assistant Professor Recruitment"
jurisdiction = "sk"
purpose = "recruitment"
conducted_by = "sk-spsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "sk-spsc-other"
name = "SPSC Recruitment to other posts (umbrella)"
jurisdiction = "sk"
purpose = "recruitment"
conducted_by = "sk-spsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

[[exams]]
id = "sk-police"
name = "Sikkim Police Constable / SI / IRBn Recruitment"
jurisdiction = "sk"
purpose = "recruitment"
conducted_by = "sk-police"
frequency = "irregular"
qualification = "class_10"
streams = ["police"]
match = { any = ["constable", 'sub[-\s]*inspector', '\bIRB'] }
status = "active"

[[exams]]
id = "sk-teacher-recruitment"
name = "Sikkim Teacher Recruitment and TET"
jurisdiction = "sk"
purpose = "recruitment"
conducted_by = "sk-hrdd"
frequency = "irregular"
qualification = "graduate"
streams = ["teaching"]
match = { any = ["teacher", '\bTET\b', '\bPRT\b|\bGT\b|\bPGT\b'] }
status = "active"
