# ---- exams -------------------------------------------------------

[[exams]]
id = "up-uppsc-pcs"
name = "Combined State / Upper Subordinate Services Examination (UP PCS)"
known_as = ["UP PCS", "UPPSC PCS"]
jurisdiction = "up"
purpose = "recruitment"
conducted_by = "up-uppsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['combined\s*state\s*/?\s*upper\s*subordinate', '\bPCS\b(?![-\s]*\(?J)'] }
status = "active"

[[exams]]
id = "up-uppsc-ae"
name = "UPPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "up"
purpose = "recruitment"
conducted_by = "up-uppsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
