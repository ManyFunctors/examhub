# ---- exams -------------------------------------------------------

[[exams]]
id = "tn-tnpsc-group-1"
name = "TNPSC Combined Civil Services Examination - I (Group I)"
known_as = ["TNPSC Group 1"]
jurisdiction = "tn"
purpose = "recruitment"
conducted_by = "tn-tnpsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['group[-\s]*I\b(?![-\s]*[BC])', 'combined\s*civil\s*services[-\s]*(examination\s*)?[-–]?\s*I\b(?!I)'] }
status = "active"

[[exams]]
id = "tn-tnpsc-ae"
name = "TNPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "tn"
purpose = "recruitment"
conducted_by = "tn-tnpsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
