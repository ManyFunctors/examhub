# ---- exams -------------------------------------------------------

[[exams]]
id = "ka-kpsc-kas"
name = "Karnataka Gazetted Probationers (Group A and B) Examination"
known_as = ["KAS", "KPSC KAS"]
jurisdiction = "ka"
purpose = "recruitment"
conducted_by = "ka-kpsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['gazetted\s*probationers?', '\bKAS\b'] }
status = "active"

[[exams]]
id = "ka-kpsc-ae"
name = "KPSC (Karnataka) Assistant Engineer / Engineering Services Examination"
jurisdiction = "ka"
purpose = "recruitment"
conducted_by = "ka-kpsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "ka-kpsc-lecturer"
name = "KPSC (Karnataka) Lecturer / Assistant Professor Recruitment"
jurisdiction = "ka"
purpose = "recruitment"
conducted_by = "ka-kpsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "ka-kpsc-other"
name = "KPSC (Karnataka) Recruitment to other posts (umbrella)"
jurisdiction = "ka"
purpose = "recruitment"
conducted_by = "ka-kpsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

[[exams]]
id = "ka-kpsc-fda-sda"
name = "KPSC First / Second Division Assistant"
jurisdiction = "ka"
purpose = "recruitment"
conducted_by = "ka-kpsc"
frequency = "irregular"
qualification = "class_12"
streams = ["clerical"]
match = { any = ['\bFDA\b', '\bSDA\b', '(first|second)\s*division\s*assistant'] }
status = "active"

[[exams]]
id = "ka-kcet"
