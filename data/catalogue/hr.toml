# ---- exams -------------------------------------------------------

[[exams]]
id = "hr-hpsc-hcs"
name = "Haryana Civil Services (Executive Branch) and Allied Services Examination"
known_as = ["HCS"]
jurisdiction = "hr"
purpose = "recruitment"
conducted_by = "hr-hpsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['\bHCS\b', 'civil\s*services?\s*\(?\s*ex'] }
status = "active"

[[exams]]
id = "hr-hpsc-ae"
name = "HPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "hr"
purpose = "recruitment"
conducted_by = "hr-hpsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "hr-hpsc-lecturer"
name = "HPSC Lecturer / Assistant Professor Recruitment"
jurisdiction = "hr"
purpose = "recruitment"
conducted_by = "hr-hpsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "hr-hpsc-judicial"
name = "HPSC Civil Judge (Junior Division) / Judicial Services Examination"
jurisdiction = "hr"
purpose = "recruitment"
conducted_by = "hr-hpsc"
frequency = "irregular"
qualification = "professional"
streams = ["judiciary", "law"]
match = { any = ['civil\s*judge', 'judicial\s*service', '\bPCS[-\s]*\(?J\)?', 'judicial\s*magistrate'] }
status = "active"

[[exams]]
id = "hr-hpsc-other"
name = "HPSC Recruitment to other posts (umbrella)"
jurisdiction = "hr"
purpose = "recruitment"
conducted_by = "hr-hpsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

[[exams]]
id = "hr-cet-group-c"
name = "Haryana Common Eligibility Test (Group C)"
short_name = "Haryana CET"
jurisdiction = "hr"
purpose = "eligibility"
conducted_by = "hr-hssc"
frequency = "irregular"
qualification = "class_12"
streams = ["general"]
match = { any = ["\\bCET\\b.*group\\s*['‘’]?\\s*C\\b", 'common\s*eligibility.*group\s*C'] }
status = "active"

[[exams]]
id = "hr-cet-group-d"
name = "Haryana Common Eligibility Test (Group D)"
jurisdiction = "hr"
purpose = "eligibility"
conducted_by = "hr-hssc"
frequency = "irregular"
qualification = "class_10"
streams = ["general"]
match = { any = ["\\bCET\\b.*group\\s*['‘’]?\\s*D\\b", "group\\s*['‘’]?\\s*D\\b"] }
status = "active"

[[exams]]
id = "hr-hssc-police-constable"
name = "Haryana Police Constable (HSSC)"
jurisdiction = "hr"
purpose = "recruitment"
conducted_by = "hr-hssc"
frequency = "irregular"
qualification = "class_12"
streams = ["police"]
match = { any = ['police\s*constable', "constable"] }
status = "active"

[[exams]]
id = "hr-hssc-tgt-pgt"
name = "HSSC TGT / PGT"
jurisdiction = "hr"
purpose = "recruitment"
conducted_by = "hr-hssc"
frequency = "irregular"
qualification = "graduate"
streams = ["teaching"]
match = { any = ['\bTGT\b', '\bPGT\b'] }
status = "active"

[[exams]]
id = "hr-hssc-other"
name = "HSSC other Group B/C recruitment (umbrella)"
jurisdiction = "hr"
purpose = "recruitment"
conducted_by = "hr-hssc"
frequency = "multiple"
qualification = "class_12"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc"] }
status = "active"

[[exams]]
id = "hr-bseh-class-10"
name = "BSEH Secondary Examination"
jurisdiction = "hr"
purpose = "school_board"
conducted_by = "hr-bseh"
frequency = "annual"
qualification = "class_8"
streams = ["school"]
match = { any = ['class\s*(X|10)\b', '\b(SSC|SSLC|HSLC|matric|madhyamik|secondary)\b(?!.*higher)'], none = ['higher\s*secondary', '\bHSC\b', 'class\s*(XII|12)\b'] }
status = "active"

[[exams]]
id = "hr-bseh-class-12"
name = "BSEH Senior Secondary Examination"
jurisdiction = "hr"
purpose = "school_board"
conducted_by = "hr-bseh"
frequency = "annual"
qualification = "class_10"
streams = ["school"]
match = { any = ['class\s*(XII|12)\b', '\b(HSC|HSSC|intermediate|inter|higher\s*secondary|uchha|plus\s*two|\+2|PUC)\b'] }
status = "active"

[[exams]]
id = "hr-htet"
name = "Haryana Teacher Eligibility Test"
short_name = "HTET"
jurisdiction = "hr"
purpose = "eligibility"
conducted_by = "hr-bseh"
frequency = "annual"
qualification = "class_12"
streams = ["teaching"]
match = { any = ['\bHTET\b', 'teacher\s*eligibility'] }
status = "active"

[[exams]]
id = "hr-power-recruitment"
name = "Haryana Power Utilities Recruitment (AE, ALM, Shift Attendant)"
jurisdiction = "hr"
purpose = "recruitment"
conducted_by = "hr-dhbvn"
frequency = "irregular"
qualification = "diploma"
streams = ["engineering", "technical"]
match = { any = ['assistant\s*engineer', '\bALM\b', 'shift\s*attendant', "recruitment"] }
status = "active"
