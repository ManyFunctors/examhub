# ---- exams -------------------------------------------------------

[[exams]]
id = "py-direct-recruitment"
name = "Puducherry Government Direct Recruitment (UDC, LDC, Assistant, Teacher)"
jurisdiction = "py"
purpose = "recruitment"
conducted_by = "py-dpar"
frequency = "irregular"
qualification = "class_12"
streams = ["general"]
match = { any = ["recruitment", '\bUDC\b|\bLDC\b', "assistant", "teacher"] }
status = "active"

[[exams]]
id = "py-police"
name = "Puducherry Police Constable / SI Recruitment"
jurisdiction = "py"
purpose = "recruitment"
conducted_by = "py-police"
frequency = "irregular"
qualification = "class_12"
streams = ["police"]
match = { any = ["constable", 'sub[-\s]*inspector'] }
status = "active"

[[exams]]
id = "py-centac-pnet"
name = "Puducherry Nursing Entrance Test"
known_as = ["PNET"]
jurisdiction = "py"
purpose = "admission"
conducted_by = "py-centac"
frequency = "irregular"
match = { any = ['(?<![A-Za-z])Puducherry[\s\-_./()]*Nursing[\s\-_./()]*Entrance[\s\-_./()]*Test(?![A-Za-z])', "(?<![A-Za-z])PNET(?![A-Za-z])"] }
status = "active"
notes = "Adopted from discovery (2026-09); evidence in the harvest's exam-proposals history."

[[exams]]
id = "py-centac-b-sc-nursing-entrance"
name = "Puducherry B.Sc. Nursing Entrance Examination"
jurisdiction = "py"
