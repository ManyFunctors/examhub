status = "active"

[[exams]]
id = "nl-police-si"
name = "Nagaland Police Sub-Inspector Recruitment"
jurisdiction = "nl"
purpose = "recruitment"
conducted_by = "nl-police"
frequency = "irregular"
qualification = "graduate"
streams = ["police"]
