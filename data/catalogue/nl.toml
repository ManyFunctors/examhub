# ---- exams -------------------------------------------------------

[[exams]]
id = "nl-npsc-ccs"
name = "Nagaland Civil Services Examination (NCS/NPS/NSS)"
jurisdiction = "nl"
purpose = "recruitment"
conducted_by = "nl-npsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['civil\s*services', 'combined\s*competitive', '\bNCS\b'] }
status = "active"

[[exams]]
id = "nl-npsc-ae"
name = "NPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "nl"
purpose = "recruitment"
conducted_by = "nl-npsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "nl-npsc-lecturer"
name = "NPSC Lecturer / Assistant Professor Recruitment"
jurisdiction = "nl"
purpose = "recruitment"
conducted_by = "nl-npsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "nl-npsc-other"
name = "NPSC Recruitment to other posts (umbrella)"
jurisdiction = "nl"
purpose = "recruitment"
conducted_by = "nl-npsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

[[exams]]
id = "nl-npsc-cts"
name = "Nagaland Combined Technical Services Examination"
jurisdiction = "nl"
purpose = "recruitment"
conducted_by = "nl-npsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['combined\s*technical'] }
status = "active"

[[exams]]
id = "nl-nssb-recruitment"
name = "NSSB Combined Recruitment (Group C)"
jurisdiction = "nl"
purpose = "recruitment"
conducted_by = "nl-nssb"
frequency = "multiple"
qualification = "class_12"
streams = ["clerical"]
match = { any = ["recruitment", "advt|advertisement", "combined"] }
status = "active"

[[exams]]
id = "nl-nbse-class-10"
name = "NBSE HSLC Examination"
jurisdiction = "nl"
purpose = "school_board"
conducted_by = "nl-nbse"
frequency = "annual"
qualification = "class_8"
streams = ["school"]
match = { any = ['\bHSLC\b', 'class\s*(X|10)\b'], none = ['higher\s*secondary', '\bHSC\b', 'class\s*(XII|12)\b'] }
status = "active"

[[exams]]
id = "nl-nbse-class-12"
name = "NBSE HSSLC Examination"
jurisdiction = "nl"
purpose = "school_board"
conducted_by = "nl-nbse"
frequency = "annual"
qualification = "class_10"
streams = ["school"]
match = { any = ['\bHSSLC\b', 'class\s*(XII|12)\b'] }
status = "active"

[[exams]]
id = "nl-ntet"
name = "Nagaland Teacher Eligibility Test"
short_name = "NTET"
jurisdiction = "nl"
purpose = "eligibility"
conducted_by = "nl-scert"
frequency = "irregular"
qualification = "class_12"
streams = ["teaching"]
match = { any = ['\bNTET\b', '\bTET\b'] }
status = "active"

[[exams]]
id = "nl-police-constable"
name = "Nagaland Police Police Constable Recruitment"
jurisdiction = "nl"
purpose = "recruitment"
conducted_by = "nl-police"
frequency = "irregular"
qualification = "class_12"
streams = ["police"]
