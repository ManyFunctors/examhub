# ---- exams -------------------------------------------------------

[[exams]]
id = "hp-hppsc-has"
name = "HP Administrative Services Combined Competitive Examination (HAS)"
known_as = ["HAS", "HPAS"]
jurisdiction = "hp"
purpose = "recruitment"
conducted_by = "hp-hppsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['\bHAS\b', 'administrative\s*service', '\bHPAS\b'] }
status = "active"

[[exams]]
id = "hp-hppsc-ae"
name = "HPPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "hp"
purpose = "recruitment"
conducted_by = "hp-hppsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "hp-hppsc-lecturer"
name = "HPPSC Lecturer / Assistant Professor Recruitment"
jurisdiction = "hp"
purpose = "recruitment"
conducted_by = "hp-hppsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "hp-hppsc-judicial"
name = "HPPSC Civil Judge (Junior Division) / Judicial Services Examination"
jurisdiction = "hp"
purpose = "recruitment"
conducted_by = "hp-hppsc"
frequency = "irregular"
qualification = "professional"
streams = ["judiciary", "law"]
match = { any = ['civil\s*judge', 'judicial\s*service', '\bPCS[-\s]*\(?J\)?', 'judicial\s*magistrate'] }
status = "active"

[[exams]]
id = "hp-hppsc-other"
name = "HPPSC Recruitment to other posts (umbrella)"
jurisdiction = "hp"
purpose = "recruitment"
conducted_by = "hp-hppsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

[[exams]]
id = "hp-hprca-group-c"
name = "HPRCA Group C recruitment (JOA IT, Clerk, Patwari, TGT, JBT)"
jurisdiction = "hp"
purpose = "recruitment"
conducted_by = "hp-hprca"
frequency = "multiple"
qualification = "class_12"
streams = ["general"]
match = { any = ['post\s*code', '\bJOA\b', "clerk", "patwari", '\bTGT\b', '\bJBT\b', "advt|advertisement|recruitment"] }
status = "active"

[[exams]]
id = "hp-hpbose-class-10"
name = "HPBOSE Matric Examination"
jurisdiction = "hp"
purpose = "school_board"
conducted_by = "hp-hpbose"
frequency = "annual"
qualification = "class_8"
streams = ["school"]
match = { any = ['class\s*(X|10)\b', '\b(SSC|SSLC|HSLC|matric|madhyamik|secondary)\b(?!.*higher)'], none = ['higher\s*secondary', '\bHSC\b', 'class\s*(XII|12)\b'] }
status = "active"

[[exams]]
id = "hp-hpbose-class-12"
name = "HPBOSE Plus Two Examination"
jurisdiction = "hp"
purpose = "school_board"
conducted_by = "hp-hpbose"
frequency = "annual"
qualification = "class_10"
streams = ["school"]
match = { any = ['class\s*(XII|12)\b', '\b(HSC|HSSC|intermediate|inter|higher\s*secondary|uchha|plus\s*two|\+2|PUC)\b'] }
status = "active"

[[exams]]
id = "hp-tet"
name = "Himachal Pradesh Teacher Eligibility Test"
short_name = "HP TET"
jurisdiction = "hp"
purpose = "eligibility"
conducted_by = "hp-hpbose"
frequency = "biannual"
qualification = "graduate"
streams = ["teaching"]
match = { any = ['\bTET\b', 'teacher\s*eligibility'] }
status = "active"

[[exams]]
id = "hp-police-constable"
name = "HP Police Police Constable Recruitment"
jurisdiction = "hp"
purpose = "recruitment"
conducted_by = "hp-police"
frequency = "irregular"
qualification = "class_12"
streams = ["police"]
match = { any = ["constable", "sipahi|sepoy", '\bPC\b'] }
status = "active"

[[exams]]
id = "hp-police-si"
name = "HP Police Sub-Inspector Recruitment"
jurisdiction = "hp"
purpose = "recruitment"
conducted_by = "hp-police"
frequency = "irregular"
qualification = "graduate"
streams = ["police"]
match = { any = ['sub[-\s]*inspector', '\bS\.?I\.?\b', "daroga"] }
status = "active"

[[exams]]
id = "hp-hc-staff"
name = "HP High Court Staff Recruitment (Clerk, Stenographer, Typist, Peon, and district courts)"
jurisdiction = "hp"
purpose = "recruitment"
conducted_by = "hp-hc"
frequency = "irregular"
qualification = "class_10"
streams = ["judiciary", "clerical"]
match = { any = ["clerk", "steno", "typist", "peon", "assistant", 'process\s*server', "driver", 'district\s*court', "group\\s*['‘’]?\\s*[CD]\\b", "recruitment"] }
status = "active"

[[exams]]
id = "hp-hpu-entrance"
name = "HPU Entrance Tests (B.Ed., MBA, PG)"
jurisdiction = "hp"
purpose = "admission"
conducted_by = "hp-hpu"
frequency = "annual"
qualification = "graduate"
streams = ["teaching", "management"]
match = { any = ["entrance", 'B\.?\s*Ed', '\bMBA\b'] }
status = "active"
