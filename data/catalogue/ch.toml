# ---- feeds -------------------------------------------------------

[[feeds]]
id = "ch-phhc/recruitment"
body = "ch-phhc"
url = "https://highcourtchd.gov.in/"
adapter = "html_links"
yields = "notices"
include = '\.pdf|recruit|advertisement|notification|result|admit|exam|vacanc'
status = "active"

[[feeds]]
id = "ch-admin/home"
body = "ch-admin"
url = "https://chandigarh.gov.in/"
adapter = "html_links"
yields = "notices"
include = '\.pdf|notif|advt|advertisement|recruit|result|admit|hall\s*ticket|answer|key|schedule|calendar|notice|exam'
status = "active"

# ---- exams -------------------------------------------------------

[[exams]]
id = "ch-phhc-staff"
name = "Punjab & Haryana HC Staff Recruitment (Clerk, Stenographer, Typist, Peon, and district courts)"
jurisdiction = "ch"
purpose = "recruitment"
conducted_by = "ch-phhc"
frequency = "irregular"
qualification = "class_10"
streams = ["judiciary", "clerical"]
match = { any = ["clerk", "steno", "typist", "peon", "assistant", 'process\s*server', "driver", 'district\s*court', "group\\s*['‘’]?\\s*[CD]\\b", "recruitment"] }
status = "active"

[[exams]]
id = "ch-teacher-recruitment"
