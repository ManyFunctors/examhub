# Reservation classes: who a fee, an age limit or a vacancy is for.
# Research and sources: docs/vocabulary.md section 1.
#
# Two rules, and everything below follows from them:
#
# 1. Map spellings, never merge classes. "UR", "General" and "Open" are one
#    class written three ways, so they are aliases of `Unreserved`. "OBC" and
#    "OBC-NCL" are two classes, and a state's own class (Karnataka 2A, Haryana
#    DSC) is never folded into a national one.
# 2. Aliases are scoped. `OSC` is an SC sub-group in Haryana and a backward
#    class in Jammu and Kashmir. A class or alias with `jurisdictions` is only
#    recognised in notices from bodies of those jurisdictions.
#
# [[class]]
#   id             national: the value itself ("Unreserved", "SC").
#                  state: "<jurisdiction>:<short>" ("hr:DSC").
#   short          what a table shows. Defaults to the id.
#   name           the full name.
#   axis           vertical   | exactly one per candidate: the social class
#                  horizontal | any number, across the vertical ones
#                  locality   | domicile, region, medium of study
#                  gender     | qualifies a row (a separate rate for men)
#                  all        | one rate for everyone
#   family         a national vertical class, for filtering only ("show every
#                  SC-type row"). Never shown, and never merged, as that class.
#   jurisdictions  where the class exists. Absent: everywhere.
#   aliases        case-insensitive regexes, matched as whole words.
#   codes          case-sensitive regexes: abbreviations that are also
#                  ordinary words or other things in lower case ("OC", "GM").
#   verified       false: from a secondary source; confirm against a notice
#                  of that body and add `source`, then drop this key.
#   source         a notice or rule that uses the class.
#
# [[alias]]  extra spellings of a class, scoped: `to`, `jurisdictions`,
#            `aliases`, `codes`.
#
# When two classes match the same words, the longer match wins ("OBC-NCL"
# over "OBC"), and at equal length a jurisdiction's own class wins over a
# national one. A label that matches nothing is kept verbatim and reported,
# never guessed.
#
# Values are never repurposed. A retired id moves to [deprecated].

schema_version = "1.0"

# ==================================================================== national

[[class]]
id = "Unreserved"
name = "Unreserved"
axis = "vertical"
aliases = [
  'un-?reserved',
  'non-?reserved',
  'general(?!\s+(?:duty|studies|knowledge|awareness|english|intelligence|science|nursing|manager|secretary|administration|instructions|conditions|information|ability|hindi|mental|merit\s+list))',
  'gen\.?(?=\s*[/,)\-:]|\s*$)',
  'open(?=\s*(?:category|merit|competition|[/,)\-:]|$))',
]
# UG is also "undergraduate": only inside a list ("UG/OBC") or as a whole cell.
codes = ['UR', 'GEN', 'Gen', 'UG(?=\s*(?:[/,:)\-]|$))', '(?<=/)UG']

[[class]]
id = "OBC"
name = "Other Backward Classes"
axis = "vertical"
# "Most backward classes" in a state with no class of that name must stay
# unmapped, not become OBC: hence the look-behinds.
aliases = [
  'obc(?!\s*[-(]?\s*(?:ncl|non[-\s]?creamy|\(?\s*cl\b))',
  'other\s+backward\s+class(?:es)?(?!\s*[-(]?\s*(?:ncl|non[-\s]?creamy))',
  '(?<!most\s)(?<!more\s)(?<!extremely\s)(?<!extreme\s)(?<!special\s)(?<!other\s)backward\s+class(?:es)?',
]
codes = ['BC']

[[class]]
id = "OBC-NCL"
name = "Other Backward Classes (Non-Creamy Layer)"
axis = "vertical"
aliases = ['obc\s*[-(]?\s*ncl\)?', 'obc\s*[-(]?\s*non[-\s]?creamy(?:\s+layer)?\)?', 'other\s+backward\s+class(?:es)?\s*[-(]?\s*(?:ncl|non[-\s]?creamy(?:\s+layer)?)\)?', 'non[-\s]?creamy\s+layer']
codes = ['NCL']

[[class]]
id = "SC"
name = "Scheduled Castes"
axis = "vertical"
# Upper case only: "B.Sc" is not a class.
aliases = ['scheduled\s+castes?']
codes = ['SC', 'S\.C\.']

[[class]]
id = "ST"
name = "Scheduled Tribes"
axis = "vertical"
aliases = ['scheduled\s+tribes?', 's\.t\.']
codes = ['ST', 'S\.T\.']

[[class]]
id = "EWS"
name = "Economically Weaker Sections"
axis = "vertical"
aliases = ['ews', 'economically\s+weaker\s+sections?']

[[class]]
id = "All candidates"
name = "All candidates"
axis = "all"
aliases = ['all\s+(?:the\s+)?(?:candidates|applicants|categor(?:y|ies))', 'for\s+all']

# -- disability (RPwD Act 2016 s.34)

[[class]]
id = "PwBD"
name = "Persons with Benchmark Disabilities"
axis = "horizontal"
aliases = [
  'pw\.?b\.?d', 'pwd', 'p\.w\.d\.?', 'divyang(?:jan)?', 'differently[-\s]abled',
  'physically\s+(?:handicapped|challenged)', 'persons?\s+with\s+(?:benchmark\s+)?disabilit(?:y|ies)',
  'disabled(?!\s+ex)', 'handicapped',
]
# PH upper case only: "Ph.D" is a degree.
codes = ['DA', 'PH', 'P\.H\.']
source = "https://www.tezu.ernet.in/PwD/RPWD-ACT-2016.pdf"

[[class]]
id = "PwBD-A"
name = "Blindness and low vision"
axis = "horizontal"
family = "PwBD"
aliases = ['blind(?:ness)?', 'low\s+vision', 'visual(?:ly)?\s+(?:impair(?:ed|ment)|handicapped)']
codes = ['VH', 'VI', 'B/LV', 'LV']

[[class]]
id = "PwBD-B"
name = "Deaf and hard of hearing"
axis = "horizontal"
family = "PwBD"
aliases = ['deaf(?!-blind)', 'hard\s+of\s+hearing', 'hearing\s+(?:impair(?:ed|ment)|handicapped)']
codes = ['HH', 'HI', 'D/HH']

[[class]]
id = "PwBD-C"
name = "Locomotor disability, including cerebral palsy, leprosy cured, dwarfism, acid attack victims and muscular dystrophy"
axis = "horizontal"
family = "PwBD"
aliases = ['locomotor(?:\s+disability)?', 'orthopa?edic(?:ally)?\s+(?:handicapped|challenged|disabilit(?:y|ies))', 'cerebral\s+palsy', 'leprosy\s+cured', 'dwarfism', 'acid\s+attack\s+victims?', 'muscular\s+dystrophy']
codes = ['OH', 'OL', 'OA', 'OAL', 'BL', 'LD', 'CP', 'AAV']

[[class]]
id = "PwBD-D"
name = "Autism, intellectual disability, specific learning disability and mental illness"
axis = "horizontal"
family = "PwBD"
aliases = ['autism', 'intellectual\s+disabilit(?:y|ies)', 'specific\s+learning\s+disabilit(?:y|ies)', 'mental\s+illness']
codes = ['ASD', 'SLD']

[[class]]
id = "PwBD-E"
name = "Multiple disabilities, including deaf-blindness"
axis = "horizontal"
family = "PwBD"
aliases = ['multiple\s+disabilit(?:y|ies)', 'deaf[-\s]blind(?:ness)?']

# -- service

