# -- locality

[[class]]
id = "Domicile"
name = "Domicile of the state"
axis = "locality"
aliases = ['domiciles?(?:\s+of\s+the\s+state)?', 'bona\s*fide\s+residents?', 'permanent\s+residents?', 'local\s+candidates?', 'natives?\s+of']

[[class]]
id = "Other State"
name = "Candidate from another state"
axis = "locality"
aliases = ['other\s+states?', 'outside\s+(?:the\s+)?state', 'non[-\s]?domicile', 'non[-\s]?locals?', 'out\s+of\s+state']

