[[class]]
id = "Dependent of Ex-Servicemen"
name = "Dependent (ward) of Ex-Servicemen"
axis = "horizontal"
family = "Ex-Servicemen"
aliases = [
  '(?:dependents?|dependants?|wards?|sons?\s*/\s*daughters?)\s+of\s+(?:the\s+)?ex[-\s]?service\s*(?:m[ae]n|personnel)',
  '(?:dependents?|dependants?|wards?)\s+of\s+esm',
  'esm\s*\(\s*dependent\s*\)',
]
codes = ['WESM', 'WoESM']

[[class]]
id = "Ex-Agniveer"
name = "Ex-Agniveer"
axis = "horizontal"
