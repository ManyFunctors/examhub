codes = ['ESM', 'EXS', 'XSM']

[[class]]
id = "Disabled Ex-Servicemen"
name = "Disabled Ex-Servicemen"
axis = "horizontal"
family = "Ex-Servicemen"
aliases = ['disabled\s+ex[-\s]?service\s*(?:m[ae]n|personnel)', 'disabled\s+esm']
