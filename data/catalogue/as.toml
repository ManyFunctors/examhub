# ---- exams -------------------------------------------------------

[[exams]]
id = "as-apsc-cce"
name = "Assam Combined Competitive Examination"
known_as = ["APSC CCE"]
jurisdiction = "as"
purpose = "recruitment"
conducted_by = "as-apsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['combined\s*competitive', '\bCCE\b'] }
status = "active"

[[exams]]
id = "as-apsc-ae"
name = "APSC (Assam) Assistant Engineer / Engineering Services Examination"
jurisdiction = "as"
purpose = "recruitment"
conducted_by = "as-apsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "as-apsc-lecturer"
name = "APSC (Assam) Lecturer / Assistant Professor Recruitment"
jurisdiction = "as"
purpose = "recruitment"
conducted_by = "as-apsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "as-apsc-other"
name = "APSC (Assam) Recruitment to other posts (umbrella)"
jurisdiction = "as"
purpose = "recruitment"
conducted_by = "as-apsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

