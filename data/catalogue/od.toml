# ---- exams -------------------------------------------------------

[[exams]]
id = "od-opsc-ocs"
name = "Odisha Civil Services Examination"
known_as = ["OCS", "OAS"]
jurisdiction = "od"
purpose = "recruitment"
conducted_by = "od-opsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['civil\s*services', '\bOCS\b'] }
status = "active"

[[exams]]
id = "od-opsc-ae"
name = "OPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "od"
purpose = "recruitment"
conducted_by = "od-opsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "od-opsc-lecturer"
name = "OPSC Lecturer / Assistant Professor Recruitment"
jurisdiction = "od"
purpose = "recruitment"
conducted_by = "od-opsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "od-opsc-judicial"
name = "OPSC Civil Judge (Junior Division) / Judicial Services Examination"
jurisdiction = "od"
purpose = "recruitment"
conducted_by = "od-opsc"
frequency = "irregular"
qualification = "professional"
streams = ["judiciary", "law"]
match = { any = ['civil\s*judge', 'judicial\s*service', '\bPCS[-\s]*\(?J\)?', 'judicial\s*magistrate'] }
status = "active"

[[exams]]
id = "od-opsc-other"
name = "OPSC Recruitment to other posts (umbrella)"
jurisdiction = "od"
purpose = "recruitment"
conducted_by = "od-opsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

[[exams]]
id = "od-opsc-medical-officer"
name = "OPSC Medical Officer (Assistant Surgeon)"
jurisdiction = "od"
purpose = "recruitment"
conducted_by = "od-opsc"
frequency = "irregular"
qualification = "professional"
streams = ["medical"]
match = { any = ['medical\s*officer', 'assistant\s*surgeon'] }
status = "active"

[[exams]]
