jurisdiction = "od"
purpose = "recruitment"
conducted_by = "od-ossc"
frequency = "irregular"
qualification = "graduate"
streams = ["clerical"]
match = { any = ['combined\s*graduate', '\bCGL\b'] }
status = "active"

[[exams]]
