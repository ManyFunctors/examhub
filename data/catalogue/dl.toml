# ---- exams -------------------------------------------------------

[[exams]]
id = "dl-dsssb-teacher"
name = "DSSSB Teacher Recruitment (PRT, TGT, PGT, Special Educator)"
jurisdiction = "dl"
purpose = "recruitment"
conducted_by = "dl-dsssb"
frequency = "annual"
qualification = "graduate"
streams = ["teaching"]
match = { any = ['\bPRT\b', '\bTGT\b', '\bPGT\b', 'special\s*educator', "teacher", "nursery"] }
status = "active"

[[exams]]
id = "dl-dsssb-combined"
name = "DSSSB Combined Examination (Group B and C)"
jurisdiction = "dl"
purpose = "recruitment"
conducted_by = "dl-dsssb"
frequency = "annual"
qualification = "class_12"
streams = ["clerical"]
match = { any = ['combined\s*exam', "group\\s*['‘’]?\\s*[BC]\\b"] }
status = "active"

[[exams]]
id = "dl-dsssb-je"
name = "DSSSB Junior Engineer / Assistant Engineer"
jurisdiction = "dl"
purpose = "recruitment"
conducted_by = "dl-dsssb"
frequency = "irregular"
qualification = "diploma"
streams = ["engineering"]
match = { any = ['junior\s*engineer', 'assistant\s*engineer'] }
status = "active"

[[exams]]
id = "dl-dsssb-other"
name = "DSSSB other recruitment (umbrella, by advertisement number)"
jurisdiction = "dl"
purpose = "recruitment"
conducted_by = "dl-dsssb"
frequency = "multiple"
qualification = "class_10"
streams = ["general"]
match = { any = ['advt|advertisement|vacanc|post\s*code'] }
status = "active"

[[exams]]
