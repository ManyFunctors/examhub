[[exams]]
id = "gj-gpsc-civil-services"
name = "Gujarat Administrative Service Class 1 and Civil Services Class 1-2 Examination"
known_as = ["GPSC Class 1-2"]
jurisdiction = "gj"
purpose = "recruitment"
conducted_by = "gj-gpsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['\bGAS\b', 'civil\s*services?\s*class', 'administrative\s*service'] }
status = "active"

