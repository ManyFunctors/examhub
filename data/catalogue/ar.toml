# ---- exams -------------------------------------------------------

[[exams]]
id = "ar-appsc-cce"
name = "Arunachal Pradesh Combined Competitive Examination"
known_as = ["APPSCCE"]
jurisdiction = "ar"
purpose = "recruitment"
conducted_by = "ar-appsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['combined\s*competitive', '\bAPPSCCE\b', '\bCCE\b'] }
status = "active"

[[exams]]
id = "ar-appsc-ae"
name = "APPSC (Arunachal) Assistant Engineer / Engineering Services Examination"
jurisdiction = "ar"
purpose = "recruitment"
conducted_by = "ar-appsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "ar-appsc-lecturer"
name = "APPSC (Arunachal) Lecturer / Assistant Professor Recruitment"
jurisdiction = "ar"
purpose = "recruitment"
conducted_by = "ar-appsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "ar-appsc-other"
name = "APPSC (Arunachal) Recruitment to other posts (umbrella)"
jurisdiction = "ar"
purpose = "recruitment"
conducted_by = "ar-appsc"
frequency = "multiple"
qualification = "graduate"
streams = ["general"]
match = { any = ["advt|advertisement|recruitment|vacanc|notification"] }
status = "active"
notes = "Catches post-specific advertisements that are not a recurring named series. Notices matched only here are candidates for new series."

[[exams]]
id = "ar-apssb-recruitment"
name = "APSSB Combined Recruitment (Group C)"
jurisdiction = "ar"
purpose = "recruitment"
conducted_by = "ar-apssb"
frequency = "multiple"
qualification = "class_12"
streams = ["clerical"]
match = { any = ["combined", "recruitment", "advt|advertisement", "group\\s*['‘’]?\\s*C\\b"] }
status = "active"

[[exams]]
id = "ar-apbse-class-10"
name = "APBSE Class 10 Examination"
jurisdiction = "ar"
purpose = "school_board"
conducted_by = "ar-apbse"
frequency = "annual"
qualification = "class_8"
streams = ["school"]
match = { any = ['class\s*(X|10)\b', '\b(SSC|SSLC|HSLC|matric|madhyamik|secondary)\b(?!.*higher)'], none = ['higher\s*secondary', '\bHSC\b', 'class\s*(XII|12)\b'] }
status = "active"

[[exams]]
id = "ar-apbse-class-12"
name = "APBSE Class 12 Examination"
jurisdiction = "ar"
purpose = "school_board"
conducted_by = "ar-apbse"
frequency = "annual"
qualification = "class_10"
streams = ["school"]
match = { any = ['class\s*(XII|12)\b', '\b(HSC|HSSC|intermediate|inter|higher\s*secondary|uchha|plus\s*two|\+2|PUC)\b'] }
status = "active"

[[exams]]
id = "ar-police"
name = "Arunachal Pradesh Police Constable / SI Recruitment"
jurisdiction = "ar"
purpose = "recruitment"
conducted_by = "ar-police"
frequency = "irregular"
qualification = "class_12"
streams = ["police"]
match = { any = ["constable", 'sub[-\s]*inspector'] }
status = "active"
