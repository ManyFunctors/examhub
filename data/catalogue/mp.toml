frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "mp-mppsc-other"
name = "MPPSC Recruitment to other posts (umbrella)"
jurisdiction = "mp"
purpose = "recruitment"
