# ---- feeds -------------------------------------------------------

[[feeds]]
id = "mp-mppsc/home"
body = "mp-mppsc"
url = "https://mppsc.mp.gov.in/"
adapter = "html_links"
yields = "notices"
include = '\.pdf|notif|advt|advertisement|recruit|result|admit|hall\s*ticket|answer|key|schedule|calendar|notice|exam'
status = "active"

[[feeds]]
id = "mp-esb/home"
body = "mp-esb"
url = "https://esb.mp.gov.in/"
adapter = "html_links"
yields = "notices"
