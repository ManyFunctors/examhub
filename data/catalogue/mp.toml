# ---- exams -------------------------------------------------------

[[exams]]
id = "mp-mppsc-sse"
name = "MPPSC State Service Examination"
known_as = ["MPPSC SSE", "MP PCS"]
jurisdiction = "mp"
purpose = "recruitment"
conducted_by = "mp-mppsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['state\s*service\s*exam', '\bSSE\b', 'राज्य\s*सेवा'] }
status = "active"

[[exams]]
id = "mp-mppsc-ae"
name = "MPPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "mp"
purpose = "recruitment"
conducted_by = "mp-mppsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
