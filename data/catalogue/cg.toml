# ---- exams -------------------------------------------------------

[[exams]]
id = "cg-cgpsc-sse"
name = "CGPSC State Service Examination"
known_as = ["CGPSC SSE"]
jurisdiction = "cg"
purpose = "recruitment"
conducted_by = "cg-cgpsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['state\s*service', '\bSSE\b', 'राज्य\s*सेवा'] }
status = "active"

[[exams]]
id = "cg-cgpsc-ae"
name = "CGPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "cg"
purpose = "recruitment"
conducted_by = "cg-cgpsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
