# ---- exams -------------------------------------------------------

[[exams]]
id = "jk-jkpsc-cce"
name = "J&K Combined Competitive Examination"
known_as = ["JKAS", "KAS"]
jurisdiction = "jk"
purpose = "recruitment"
conducted_by = "jk-jkpsc"
frequency = "annual"
qualification = "graduate"
streams = ["civil_services"]
match = { any = ['combined\s*competitive', '\bCCE\b', '\bKAS\b'] }
status = "active"

[[exams]]
id = "jk-jkpsc-ae"
name = "JKPSC Assistant Engineer / Engineering Services Examination"
jurisdiction = "jk"
purpose = "recruitment"
conducted_by = "jk-jkpsc"
frequency = "irregular"
qualification = "graduate"
streams = ["engineering"]
match = { any = ['assistant\s*engineer', 'engineering\s*services?', '\bAE\b'] }
status = "active"

[[exams]]
id = "jk-jkpsc-lecturer"
name = "JKPSC Lecturer / Assistant Professor Recruitment"
jurisdiction = "jk"
purpose = "recruitment"
conducted_by = "jk-jkpsc"
frequency = "irregular"
qualification = "postgraduate"
streams = ["teaching"]
match = { any = ["lecturer", 'assistant\s*professor', "principal"] }
status = "active"

[[exams]]
id = "jk-jkpsc-judicial"
name = "JKPSC Civil Judge (Junior Division) / Judicial Services Examination"
jurisdiction = "jk"
purpose = "recruitment"
conducted_by = "jk-jkpsc"
frequency = "irregular"
qualification = "professional"
streams = ["judiciary", "law"]
match = { any = ['civil\s*judge', 'judicial\s*service', '\bPCS[-\s]*\(?J\)?', 'judicial\s*magistrate'] }
status = "active"

[[exams]]
id = "jk-jkpsc-other"
name = "JKPSC Recruitment to other posts (umbrella)"
jurisdiction = "jk"
purpose = "recruitment"
