# Read chosen feeds once from a GitHub runner and show what came back.
#
# A government site can answer a laptop and time out a runner, so access has to
# be checked from here (see docs/day-to-day.md). Nothing is saved: the harvest
# branch is neither read nor written, and the result is in the job log.
name: probe-feeds

on:
  workflow_dispatch:
    inputs:
      feeds:
        description: "feed id(s), comma separated, e.g. in-upsc/exam-notifications,in-rrb/updates"
        required: false
        default: ""
      pages:
        description: "page URL(s), comma separated: print the status and every link a plain fetch sees"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e '.[crawl]'

      - name: Look at pages
        if: inputs.pages != ''
        env:
          PAGES: ${{ inputs.pages }}
        run: |
          # fetched the way the crawler fetches (its own TLS settings)
          for url in ${PAGES//,/ }; do
            uv run scrapy fetch --nolog "$url" > work_page.html || echo "$url FAILED"
            echo "$url $(wc -c < work_page.html) bytes"
            python3 - <<'PY'
          import re
          html = open("work_page.html", errors="ignore").read()
          for m in re.finditer(r"action[\x27\x22]?\s*[:=]\s*[\x27\x22](\w+)[\x27\x22]", html):
              print("  ACTION:", html[max(0, m.start() - 150):m.end() + 350].replace("\n", " ")[:520])
          for m in re.finditer(r"(?:pageGroup|selectedCategory|currentTerm|itemsPerPage|selectedSubcategory|page_group)\s*[=:]\s*[^;\n]{0,100}", html):
              print("  VAR:", m.group(0)[:140])
          for href, text in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', html, re.S)[:150]:
              print("  ", href[:110], "|", re.sub(r"<[^>]+>|\s+", " ", text).strip()[:80])
          PY
          done

      - name: Firefox and geckodriver
        run: |
          firefox --version
          ls "$GECKOWEBDRIVER"

      - name: Read the feeds
        if: inputs.feeds != ''
        env:
          FEEDS: ${{ inputs.feeds }}
          MOZ_HEADLESS: "1"
          EXAMHUB_HTTPCACHE: "0"
        run: |
          mkdir -p data/harvest work
          uv run scrapy crawl feeds -a feed="$FEEDS" -s LOG_LEVEL=INFO -s LOG_FILE=work/probe.log || true
          grep -E "WARNING|ERROR|feeds\[|timeout|Timeout|exception" work/probe.log | cut -c1-300 | tail -30
          echo "## feed health" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          for l in open("data/harvest/feed-health.jsonl"):
              r = json.loads(l)
              print(r["id"], "ok" if r.get("ok") else "FAILED", "count", r.get("count"), "status", r.get("status"), r.get("error", "")[:200])
          PY
          echo '```' >> "$GITHUB_STEP_SUMMARY"
