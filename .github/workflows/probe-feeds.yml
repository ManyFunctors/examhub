# Read chosen feeds once from a GitHub runner and show what came back.
#
# A government site can answer a laptop and time out a runner, so access has to
# be checked from here (see docs/day-to-day.md). Nothing is saved: the harvest
# branch is neither read nor written, and the result is in the job log.
name: probe-feeds

on:
  workflow_dispatch:
    inputs:
      feeds:
        description: "feed id(s), comma separated, e.g. in-upsc/exam-notifications,in-rrb/updates"
        required: false
        default: ""
      pages:
        description: "page URL(s), comma separated: print the status and every link a plain fetch sees"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Look at pages
        if: inputs.pages != ''
        env:
          PAGES: ${{ inputs.pages }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request
          for url in os.environ["PAGES"].split(","):
              req = urllib.request.Request(url.strip(), headers={"User-Agent": "Mozilla/5.0"})
              try:
                  r = urllib.request.urlopen(req, timeout=60)
                  html = r.read().decode("utf-8", "ignore")
              except Exception as e:
                  print(url, "ERROR", repr(e)[:200]); continue
              print(url, r.status, len(html), "bytes")
              for href, text in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', html, re.S)[:150]:
                  print("  ", href[:110], "|", re.sub(r"<[^>]+>|\s+", " ", text).strip()[:80])
          PY

      - name: Install
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install -e '.[crawl]'

      - name: Firefox and geckodriver
        run: |
          firefox --version
          ls "$GECKOWEBDRIVER"

      - name: Read the feeds
        if: inputs.feeds != ''
        env:
          FEEDS: ${{ inputs.feeds }}
          MOZ_HEADLESS: "1"
          EXAMHUB_HTTPCACHE: "0"
        run: |
          mkdir -p data/harvest work
          uv run scrapy crawl feeds -a feed="$FEEDS" -s LOG_LEVEL=INFO -s LOG_FILE=work/probe.log || true
          grep -E "WARNING|ERROR|feeds\[|timeout|Timeout|exception" work/probe.log | cut -c1-300 | tail -30
          echo "## feed health" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          for l in open("data/harvest/feed-health.jsonl"):
              r = json.loads(l)
              print(r["id"], "ok" if r.get("ok") else "FAILED", "count", r.get("count"), "status", r.get("status"), r.get("error", "")[:200])
          PY
          echo '```' >> "$GITHUB_STEP_SUMMARY"
