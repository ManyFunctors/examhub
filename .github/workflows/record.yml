# The steps that write records, open the pull request and say when nothing
# changed. Shared by the nightly recheck and the per-jurisdiction loops, so
# both write records the same way. The caller passes the review's exit code
# (0 = something changed, 2 = nothing changed) and puts the review bundle
# where this workflow can download it as `review-bundle`.
name: record

on:
  workflow_call:
    inputs:
      review_exit:
        description: "exit code of the review: 0 something changed, 2 nothing changed"
        required: true
        type: string

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write        # push the pipeline/* branch
      pull-requests: write   # open the pull request
      actions: write         # start the site build after a merge
    steps:
      - uses: actions/checkout@v7
        with:
          # The work happens on a branch, never on the default one.
          ref: main
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install the pipeline
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.0" "laya>=0.3.20"
          uv pip install -e '.[crawl,model,ocr,dev]'

      - name: Download the review bundle
        # A review that wrote no bundle leaves nothing to apply; the steps
        # below then do nothing.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: review-bundle
          path: work/reviews/

      - name: Apply the proposal to site/
        # The patch paths are relative to the site folder.
        if: inputs.review_exit == '0'
        run: |
          latest=$(ls -1dt work/reviews/*/ | head -1)
          git apply --directory=site "$latest/propose.patch"

      - name: Fetch what the crawl learnt
        # Link checks and Wayback copies live on the `harvest` branch; read only.
        run: |
          mkdir -p data/harvest
          if git fetch --depth=1 origin harvest 2>/dev/null; then
            for f in link-check.jsonl archived.jsonl notices.jsonl; do
              git show "FETCH_HEAD:data/harvest/$f" > "data/harvest/$f" 2>/dev/null || rm -f "data/harvest/$f"
            done
            # the per-exam profiles the PDFs were merged into
            git archive FETCH_HEAD data/harvest/exams 2>/dev/null | tar -x || true
          fi
          ls -l data/harvest || true

      - name: Drop wrong other names
        # An alias naming another kind of eligibility test (KTET on KSET) is dropped.
        id: aliases
        run: |
          set +e
          uv run python -m examhub_pipeline aliases --apply
          code=$?
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = 1 ]; then echo "::warning::checking other names failed; records left unchanged"; fi
          exit 0

      - name: Fix official page links
        # Each link placed by what the crawl's link check found it to be: files to the
        # documents, a portal as the apply link, the page naming the exam as the official page.
        id: links
        run: |
          set +e
          uv run python -m examhub_pipeline links --apply
          code=$?
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = 1 ]; then echo "::warning::fixing official page links failed; records left unchanged"; fi
          exit 0

      - name: Link Wayback copies
        # The daily crawl archives each document a record links to and keeps the
        # snapshots on the `harvest` branch; this writes them into document_archive.
        id: wayback
        run: |
          set +e
          if [ -f data/harvest/archived.jsonl ]; then
            uv run python -m examhub_pipeline archive --fill-records --apply
            code=$?
          else
            echo "no archived.jsonl on the harvest branch yet"; code=2
          fi
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = 1 ]; then echo "::warning::linking Wayback copies failed; records left unchanged"; fi
          exit 0

      - name: Give live tracked exams a page
        # A catalogue exam whose current cycle has dates in the crawl's profile gets
        # a blank record here; the next steps fill it (see promote.py).
        id: promote
        run: |
          set +e
          uv run python -m examhub_pipeline promote --apply
          code=$?
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = 1 ]; then echo "::warning::promoting tracked exams failed; nothing added"; fi
          exit 0

      - name: Fill dates and vacancies from the PDFs
        # The crawl's per-exam profiles, written into the records only where the
        # cycle matches and the record has no value of its own (see profile_fill.py).
        id: fill
        run: |
          set +e
          uv run python -m examhub_pipeline fill-profiles --apply
          code=$?
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = 1 ]; then echo "::warning::filling from the PDFs failed; records left unchanged"; fi
          exit 0

      - name: Merge duplicate records
        # One exam harvested into two files is merged when no fact is lost; the old URL
        # redirects. Files that disagree stay apart and are listed. Before the titles, so
        # the merged record gets its short name in the same run.
        id: dedupe
        run: |
          set +e
          uv run python -m examhub_pipeline dedupe --apply
          code=$?
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = 1 ]; then echo "::warning::merging duplicates failed; records left unchanged"; fi
          exit 0

      - name: Fill short titles
        # Records still titled with the notice's own name get a short one
        # (decision 3). Deterministic, no network. Exit 0 = titles changed,
        # 2 = nothing to do, 1 = the step failed; a failure never stops the run.
        id: names
        run: |
          set +e
          uv run python -m examhub_pipeline names --apply
          code=$?
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = 1 ]; then echo "::warning::short titles failed; titles left unchanged"; fi
          exit 0

      - name: Regenerate tracked-exam stubs
        # A stub page for every catalogue exam with no live cycle yet, so a
        # search for one finds it instead of nothing. Regenerated wholesale
        # from the catalogue, so one appears or disappears automatically as
        # notices arrive -- no exam picked out by hand.
        id: tracked
        run: |
          set +e
          uv run python -m examhub_pipeline tracked --apply
          code=$?
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = 1 ]; then echo "::warning::tracked-exam stubs failed; left unchanged"; fi
          exit 0

      - name: Refresh the README's stats table
        # Riding along on whatever PR opens tonight, rather than one of its
        # own: the numbers only drift slowly, and a PR for nothing but a
        # bigger notice count would be the kind of nightly noise this whole
        # workflow is built to avoid.
        id: readme
        run: |
          set +e
          uv run python -m examhub_pipeline readme-stats --apply
          code=$?
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = 1 ]; then echo "::warning::readme stats failed; README left unchanged"; fi
          exit 0

      - name: Install Hugo
        run: |
          curl -sSLo hugo.deb "https://github.com/gohugoio/hugo/releases/download/v0.166.0/hugo_extended_0.166.0_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Gate the change before it is published
        # A pull request made with GITHUB_TOKEN triggers no checks of its own,
        # so the checks run here, on the tree the pull request will carry:
        # tests, catalogue lint, the site build and the browse-page check.
        # Failing the gate still opens the pull request, but it is not merged.
        id: gate
        run: |
          set +e
          ok=true
          uv run pytest -q -m "not model" || ok=false
          uv run python -m examhub_pipeline catalogue lint || ok=false
          (cd site && TZ=Asia/Kolkata hugo --gc --minify --baseURL "/" && node tools/check-home.mjs public) || ok=false
          rm -rf site/public site/resources
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = true ] || echo "::warning::the gate failed; the pull request stays open for a person"
          exit 0

      - name: Open a pull request
        # The whole point. Nothing changed, nothing is opened.
        if: inputs.review_exit == '0' || steps.names.outputs.changed == 'true' || steps.dedupe.outputs.changed == 'true' || steps.wayback.outputs.changed == 'true' || steps.fill.outputs.changed == 'true' || steps.promote.outputs.changed == 'true' || steps.links.outputs.changed == 'true' || steps.aliases.outputs.changed == 'true' || steps.readme.outputs.changed == 'true' || steps.tracked.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: pipeline/nightly-recheck
          base: ${{ github.event.repository.default_branch }}
          # An empty patch is a failure, not a no-op: exit 2 handles that
          # case upstream and this guard means a logic error cannot produce a
          # pull request with nothing in it.
          add-paths: |
            site/content/exams/
            site/content/tracked/
            README.md
          title: "pipeline: re-checked official exam notices"
          commit-message: |
            pipeline: re-check official exam notices

            Produced by examhub-pipeline. Merged automatically when the
            gate passes. Every value in the diff carries a verdict in
            work/reviews/<timestamp>/report.json.
          body: |
            Automated re-check of official notices. It merges itself when the
            tests, catalogue lint and site build pass; if it is still open,
            the gate failed (see the run), so read the diff before merging.

            Checklist for a manual merge:

            - [ ] The diff is read against the source document, not just
                  skimmed. Only `verified` values were written; anything the
              model disbelieved was left alone and flagged in the bundle.
            - [ ] Any `[OCR page]` value was checked against the scan. Every
              field on an image-only page is OCR output and can be wrong.
            - [ ] Any `provisional` status is genuinely a date the body has
                  published but not fixed.
            - [ ] `provenance.last_checked` moved, and the record's
              `provenance.source_url` is still the right document.
            - [ ] Any new short `title` reads as people search for the exam
                  (the `names` step log lists each one and where it came from).
            - [ ] Any deleted record was merged into the one its `aliases` point
                  from (the `dedupe` step log names each pair).

            Full bundle: the `review-bundle` artifact from this run.
          labels: |
            automated

      - name: Merge it and publish the site
        # No branch protection, so this is a direct squash merge. A merge made
        # with GITHUB_TOKEN starts no push workflow, so the site build is
        # started by hand.
        if: steps.gate.outputs.ok == 'true' && steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --squash --delete-branch
          gh workflow run site.yml --ref main

      - name: No pull request needed
        if: inputs.review_exit == '2' && steps.names.outputs.changed != 'true' && steps.dedupe.outputs.changed != 'true' && steps.wayback.outputs.changed != 'true' && steps.fill.outputs.changed != 'true' && steps.promote.outputs.changed != 'true' && steps.links.outputs.changed != 'true' && steps.aliases.outputs.changed != 'true' && steps.tracked.outputs.changed != 'true'
        run: echo "Nothing changed. No pull request, which is the point."
