# Nightly re-check of official exam notices.
#
# The one behaviour that matters: **a pull request is opened only when
# something changed.** A job that opens an empty pull request every night gets
# muted by the person it is meant to help, and then the site stops being
# checked at all. The `review` subcommand exits 2 when there is nothing to say
# and this workflow treats that as success and stops.
#
# It commits to a `pipeline/*` branch and pushes that branch. It cannot write
# to the default branch: the default branch is protected in the repository
# settings, and every change reaches it only through a reviewed pull request.
name: recheck

on:
  schedule:
    # 02:17 IST. An off-round minute, because every scheduled workflow in the
    # world is queued at :00 and a government host is the last thing that
    # should be receiving a thundering herd.
    - cron: "47 20 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "source key(s), comma separated; empty = picked automatically (due dates first)"
        required: false
        default: ""
      max_requests:
        description: "per-run network request budget"
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  # Never let two runs fight over the same branch or the same cache.
  group: recheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      exit_code: ${{ steps.review.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The work happens on a branch, never on the default one.
          ref: main
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Cache tesseract language data
        uses: actions/cache@v5
        with:
          path: ~/.cache/tessdata
          key: tessdata-${{ runner.os }}

      - name: Install the pipeline
        run: |
          uv python install 3.12
          uv venv --python 3.12
          # CPU-only torch first. The default PyPI wheel drags in ~2.5 GB of
          # CUDA libraries for a runner that has no GPU, and the download
          # alone is most of this job's wall clock.
          uv pip install --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.0" "laya>=0.3.20"
          uv pip install -e '.[crawl,model,ocr,dev]'

      - name: Install tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng ocrmypdf

      - name: Run the tests
        # No `-m model`: the model tests take minutes and the nightly run does
        # its own measurement below. This is the fast regression gate.
        run: uv run pytest -q -m "not model"

      - name: Pick which sources to check tonight
        # A manual dispatch with --source wins; otherwise the sources behind
        # an exam with a date due soon go first, topped up with the day's
        # rotation pick so a quiet source still gets an occasional look.
        id: pick
        run: |
          if [ -n "${{ inputs.source }}" ]; then
            sources="${{ inputs.source }}"
          else
            sources=$(uv run python -m examhub_pipeline due-sources --within-days 5 --cap 15)
          fi
          echo "sources=$sources" >> "$GITHUB_OUTPUT"
          echo "tonight's sources: $sources"

      - name: Fetch, extract, validate and review
        id: review
        env:
          # Identify the tool and give the maintainer a way to answer. Set this
          # as a repository secret; the default is a deliberately unroutable
          # placeholder, and several government hosts block unidentified
          # clients on robots.txt alone.
          # The HTTP cache is what makes a re-run free, and it is worth
          # keeping between runs so a nightly job is mostly a cache hit.
          EXAMHUB_CACHE_DIR: .cache/http
        run: |
          # Never let a fetch error take the whole run down. `review` returns
          # 3 for a partial result and 1 for a hard error, and both of those
          # are still worth a bundle to read.
          set +e
          SOURCE_ARGS=()
          IFS=',' read -ra KEYS <<< "${{ steps.pick.outputs.sources }}"
          for k in "${KEYS[@]}"; do [ -n "$k" ] && SOURCE_ARGS+=(--source "$k"); done
          uv run python -m examhub_pipeline run \
            "${SOURCE_ARGS[@]}" \
            --run-limit 6 \
            --max-requests "${{ inputs.max_requests || 60 }}" \
            --host-delay 5
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish the review summary
        if: always()
        run: |
          {
            echo "## examhub-pipeline nightly re-check"
            echo
            echo "Exit code: \`${{ steps.review.outputs.exit_code }}\`"
            echo
            echo "- \`0\` -- something changed; a pull request follows"
            echo "- \`2\` -- nothing changed; **no pull request is opened**"
            echo "- \`3\` -- partial; some documents failed, review anyway"
            echo
            if [ -d work/reviews ]; then
              latest=$(ls -1dt work/reviews/*/ | head -1 || true)
              if [ -n "$latest" ]; then
                echo "### \(latest\)"
                echo
                echo '```'
                cat "$latest/summary.txt" 2>/dev/null || echo "(no summary)"
                echo '```'
              fi
            else
              echo "_No review bundle was produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the review bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-bundle
          path: work/reviews/
          retention-days: 14
          if-no-files-found: ignore

  record:
    needs: review
    uses: ./.github/workflows/record.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      review_exit: ${{ needs.review.outputs.exit_code }}
