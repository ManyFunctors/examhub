# Nightly re-check of official exam notices.
#
# The one behaviour that matters: **a pull request is opened only when
# something changed.** A job that opens an empty pull request every night gets
# muted by the person it is meant to help, and then the site stops being
# checked at all. The `review` subcommand exits 2 when there is nothing to say
# and this workflow treats that as success and stops.
#
# It commits to a `pipeline/*` branch and pushes that branch. It cannot write
# to the default branch: the default branch is protected in the repository
# settings, and every change reaches it only through a reviewed pull request.
name: recheck

on:
  schedule:
    # 02:17 IST. An off-round minute, because every scheduled workflow in the
    # world is queued at :00 and a government host is the last thing that
    # should be receiving a thundering herd.
    - cron: "47 20 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "source key (repeatable is not possible here; comma separated)"
        required: false
        default: "ugcnet"
      max_requests:
        description: "per-run network request budget"
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  # Never let two runs fight over the same branch or the same cache.
  group: recheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write        # push the pipeline/* branch
      pull-requests: write   # open the pull request
    steps:
      - uses: actions/checkout@v4
        with:
          # The work happens on a branch, never on the default one.
          ref: main
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache tesseract language data
        uses: actions/cache@v4
        with:
          path: ~/.cache/tessdata
          key: tessdata-${{ runner.os }}

      - name: Install the pipeline
        run: |
          uv python install 3.12
          uv venv --python 3.12
          # CPU-only torch first. The default PyPI wheel drags in ~2.5 GB of
          # CUDA libraries for a runner that has no GPU, and the download
          # alone is most of this job's wall clock.
          uv pip install --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.0" "laya>=0.3.20"
          uv pip install -e '.[model,ocr,dev]'

      - name: Install tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng ocrmypdf

      - name: Run the tests
        # No `-m model`: the model tests take minutes and the nightly run does
        # its own measurement below. This is the fast regression gate.
        run: uv run pytest -q -m "not model"

      - name: Fetch, extract, validate and review
        id: review
        env:
          # Identify the tool and give the maintainer a way to answer. Set this
          # as a repository secret; the default is a deliberately unroutable
          # placeholder, and several government hosts block unidentified
          # clients on robots.txt alone.
          EXAMHUB_CONTACT: ${{ secrets.EXAMHUB_CONTACT }}
          # The HTTP cache is what makes a re-run free, and it is worth
          # keeping between runs so a nightly job is mostly a cache hit.
          EXAMHUB_CACHE_DIR: .cache/http
        run: |
          # Never let a fetch error take the whole run down. `review` returns
          # 3 for a partial result and 1 for a hard error, and both of those
          # are still worth a bundle to read.
          set +e
          uv run python -m examhub_pipeline run \
            --source "${{ inputs.source || 'ugcnet' }}" \
            --run-limit 6 \
            --max-requests "${{ inputs.max_requests || 60 }}" \
            --host-delay 5
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish the review summary
        if: always()
        run: |
          {
            echo "## examhub-pipeline nightly re-check"
            echo
            echo "Exit code: \`${{ steps.review.outputs.exit_code }}\`"
            echo
            echo "- \`0\` -- something changed; a pull request follows"
            echo "- \`2\` -- nothing changed; **no pull request is opened**"
            echo "- \`3\` -- partial; some documents failed, review anyway"
            echo
            if [ -d work/reviews ]; then
              latest=$(ls -1dt work/reviews/*/ | head -1 || true)
              if [ -n "$latest" ]; then
                echo "### \(latest\)"
                echo
                echo '```'
                cat "$latest/summary.txt" 2>/dev/null || echo "(no summary)"
                echo '```'
              fi
            else
              echo "_No review bundle was produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-bundle
          path: work/reviews/
          retention-days: 14
          if-no-files-found: ignore

      - name: Apply the proposal to site/
        # The patch paths are relative to the site folder.
        if: steps.review.outputs.exit_code == '0'
        run: |
          latest=$(ls -1dt work/reviews/*/ | head -1)
          git apply --directory=site "$latest/propose.patch"

      - name: Fetch what the crawl learnt
        # Link checks and Wayback copies live on the `harvest` branch; read only.
        run: |
          mkdir -p data/harvest
          if git fetch --depth=1 origin harvest 2>/dev/null; then
            for f in link-check.jsonl archived.jsonl notices.jsonl; do
              git show "FETCH_HEAD:data/harvest/$f" > "data/harvest/$f" 2>/dev/null || rm -f "data/harvest/$f"
            done
          fi
          ls -l data/harvest || true

      - name: Drop wrong other names
        # An alias naming another kind of eligibility test (KTET on KSET) is dropped.
        id: aliases
        run: |
          set +e
          uv run python -m examhub_pipeline aliases --apply
          code=$?
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = 1 ]; then echo "::warning::checking other names failed; records left unchanged"; fi
          exit 0

      - name: Fix official page links
        # Each link placed by what the crawl's link check found it to be: files to the
        # documents, a portal as the apply link, the page naming the exam as the official page.
        id: links
        run: |
          set +e
          uv run python -m examhub_pipeline links --apply
          code=$?
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = 1 ]; then echo "::warning::fixing official page links failed; records left unchanged"; fi
          exit 0

      - name: Link Wayback copies
        # The daily crawl archives each document a record links to and keeps the
        # snapshots on the `harvest` branch; this writes them into document_archive.
        id: wayback
        run: |
          set +e
          if [ -f data/harvest/archived.jsonl ]; then
            uv run python -m examhub_pipeline archive --fill-records --apply
            code=$?
          else
            echo "no archived.jsonl on the harvest branch yet"; code=2
          fi
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = 1 ]; then echo "::warning::linking Wayback copies failed; records left unchanged"; fi
          exit 0

      - name: Merge duplicate records
        # One exam harvested into two files is merged when no fact is lost; the old URL
        # redirects. Files that disagree stay apart and are listed. Before the titles, so
        # the merged record gets its short name in the same run.
        id: dedupe
        run: |
          set +e
          uv run python -m examhub_pipeline dedupe --apply
          code=$?
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = 1 ]; then echo "::warning::merging duplicates failed; records left unchanged"; fi
          exit 0

      - name: Fill short titles
        # Records still titled with the notice's own name get a short one
        # (decision 3). Deterministic, no network. Exit 0 = titles changed,
        # 2 = nothing to do, 1 = the step failed; a failure never stops the run.
        id: names
        run: |
          set +e
          uv run python -m examhub_pipeline names --apply
          code=$?
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = 1 ]; then echo "::warning::short titles failed; titles left unchanged"; fi
          exit 0

      - name: Refresh the README's stats table
        # Riding along on whatever PR opens tonight, rather than one of its
        # own: the numbers only drift slowly, and a PR for nothing but a
        # bigger notice count would be the kind of nightly noise this whole
        # workflow is built to avoid.
        id: readme
        run: |
          set +e
          uv run python -m examhub_pipeline readme-stats --apply
          code=$?
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$code" = 1 ]; then echo "::warning::readme stats failed; README left unchanged"; fi
          exit 0

      - name: Open a pull request
        # The whole point. Nothing changed, nothing is opened.
        if: steps.review.outputs.exit_code == '0' || steps.names.outputs.changed == 'true' || steps.dedupe.outputs.changed == 'true' || steps.wayback.outputs.changed == 'true' || steps.links.outputs.changed == 'true' || steps.aliases.outputs.changed == 'true' || steps.readme.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: pipeline/nightly-recheck
          base: ${{ github.event.repository.default_branch }}
          # An empty patch is a failure, not a no-op: exit 2 handles that
          # case upstream and this guard means a logic error cannot produce a
          # pull request with nothing in it.
          add-paths: |
            site/content/exams/
            README.md
          title: "pipeline: re-checked official exam notices"
          commit-message: |
            pipeline: re-check official exam notices

            Produced by examhub-pipeline. Human-reviewed; not published
            automatically. Every value in the diff carries a verdict in
            work/reviews/<timestamp>/report.json.
          body: |
            Automated re-check of official notices. **Do not merge without
            reading the diff.**

            - [ ] The diff is read against the source document, not just
                  skimmed. Only `verified` values were written; anything the
              model disbelieved was left alone and flagged in the bundle.
            - [ ] Any `[OCR page]` value was checked against the scan. Every
              field on an image-only page is OCR output and can be wrong.
            - [ ] Any `provisional` status is genuinely a date the body has
                  published but not fixed.
            - [ ] `provenance.last_checked` moved, and the record's
              `provenance.source_url` is still the right document.
            - [ ] Any new short `title` reads as people search for the exam
                  (the `names` step log lists each one and where it came from).
            - [ ] Any deleted record was merged into the one its `aliases` point
                  from (the `dedupe` step log names each pair).

            Full bundle: the `review-bundle` artifact from this run.
          labels: |
            automated
            needs-review

      - name: No pull request needed
        if: steps.review.outputs.exit_code == '2' && steps.names.outputs.changed != 'true' && steps.dedupe.outputs.changed != 'true' && steps.wayback.outputs.changed != 'true' && steps.links.outputs.changed != 'true' && steps.aliases.outputs.changed != 'true'
        run: echo "Nothing changed. No pull request, which is the point."
